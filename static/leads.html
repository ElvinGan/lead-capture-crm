<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM contacts</title>
<style>
  body { font: 15px/1.45 system-ui, sans-serif; background: #f5f6f8; color: #1d2733; margin: 0; }
  nav { background: #fff; border-bottom: 1px solid #dde2e8; padding: 14px 24px; display: flex; justify-content: space-between; }
  nav a { color: #1f6feb; text-decoration: none; font-size: 14px; }
  main { max-width: 1200px; margin: 24px auto; padding: 0 16px; display: grid; grid-template-columns: 3fr 1fr; gap: 20px; }
  section { background: #fff; border: 1px solid #dde2e8; border-radius: 8px; padding: 16px; min-width: 0; overflow-x: auto; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; border-bottom: 2px solid #dde2e8; padding: 6px 8px; }
  td { border-bottom: 1px solid #eceff3; padding: 7px 8px; vertical-align: top; }
  ul { list-style: none; margin: 0; padding: 0; } li { border-bottom: 1px solid #eceff3; padding: 8px 0; }
  pre { margin: 4px 0 0; white-space: pre-wrap; font: 12px/1.4 ui-monospace, monospace; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<nav><b>CRM contacts</b><a href="/">Back to the form</a></nav>
<main>
  <section>
    <h2>Contacts</h2>
    <table>
      <tr><th>Name</th><th>Company</th><th>Email</th><th>Phone</th><th>Submissions</th><th>Tags</th></tr>
      {{ROWS}}
    </table>
  </section>
  <section><h2>Team notifications</h2><ul>{{NOTES}}</ul></section>
</main>
</body>
</html>
