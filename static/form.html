<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Request a quote</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; background: #f5f6f8; color: #1d2733; margin: 0; }
  nav { background: #fff; border-bottom: 1px solid #dde2e8; padding: 14px 24px; display: flex; justify-content: space-between; }
  nav a { color: #1f6feb; text-decoration: none; font-size: 14px; }
  main { max-width: 520px; margin: 32px auto; padding: 0 16px; }
  form { background: #fff; border: 1px solid #dde2e8; border-radius: 8px; padding: 24px; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  label { display: block; font-size: 14px; font-weight: 600; margin: 12px 0 4px; }
  input, textarea { width: 100%; box-sizing: border-box; padding: 9px 10px; border: 1px solid #c9d1d9; border-radius: 6px; font: inherit; }
  textarea { height: 90px; }
  .row { display: flex; gap: 12px; } .row > div { flex: 1; }
  button { margin-top: 18px; width: 100%; padding: 11px; border: 0; border-radius: 6px; background: #1f6feb; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  .hp { position: absolute; left: -9999px; }
  #msg { padding: 10px 12px; border-radius: 6px; margin-bottom: 14px; display: none; }
  #msg.ok { display: block; background: #e6f4ea; color: #1a6b32; }
  #msg.bad { display: block; background: #fdecec; color: #b3261e; }
</style>
</head>
<body>
<nav><b>Brightline Renovations (demo)</b><a href="/leads">View CRM contacts</a></nav>
<main>
  <form method="post" action="/submit">
    <div id="msg"></div>
    <h1>Request a free quote</h1>
    <div class="row">
      <div><label for="first_name">First name</label><input id="first_name" name="first_name"></div>
      <div><label for="last_name">Last name</label><input id="last_name" name="last_name"></div>
    </div>
    <label for="email">Email</label><input id="email" name="email" type="email">
    <div class="row">
      <div><label for="phone">Phone</label><input id="phone" name="phone" type="tel"></div>
      <div><label for="company">Company</label><input id="company" name="company"></div>
    </div>
    <label for="message">What do you need?</label><textarea id="message" name="message"></textarea>
    <input class="hp" name="website" tabindex="-1" autocomplete="off">
    <button type="submit">Send request</button>
  </form>
</main>
<script>
  const q = new URLSearchParams(location.search), msg = document.getElementById('msg');
  if (q.get('ok')) { msg.className = 'ok'; msg.textContent = 'Thanks, we will be in touch.'; }
  if (q.get('error')) { msg.className = 'bad'; msg.textContent = 'Please check: ' + q.get('error').replace(/ /g, ', '); }
</script>
</body>
</html>
